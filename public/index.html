<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Football VR Multiplayer</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#07120d;color:#effff2;font-family:system-ui}#panel{position:fixed;z-index:3;top:12px;left:12px;width:min(320px,calc(100vw - 52px));padding:14px;border:1px solid #ffffff30;border-radius:15px;background:#07140fee}h1{font-size:17px;color:#a8ffbd;margin:0 0 8px}p{font-size:13px;line-height:1.4}input,button{box-sizing:border-box;width:100%;padding:11px;margin:4px 0;border-radius:9px;border:1px solid #ffffff35}input{background:#10251a;color:white}button{background:#a8ffbd;color:#062111;font-weight:800;border:0}#vr{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);width:auto;padding:13px 22px;font-size:16px}#status{color:#b9d5c1;font-size:12px}</style></head>
<body><div id="panel"><h1>⚽ FOOTBALL VR · MULTIPLAYER</h1><p>Both players open this same URL and enter the same room code.</p><input id="name" maxlength="18" value="Player" placeholder="Player name"><input id="room" maxlength="12" value="KICKOFF" placeholder="Room code"><button id="join">JOIN MATCH</button><h2 id="score">0 — 0</h2><p id="status">Join a room to connect.</p><p>Desktop: click the ball to shoot. In VR: aim a controller at the ball and squeeze the trigger.</p></div><button id="vr" hidden>ENTER VR</button>
<script src="/socket.io/socket.io.js"></script><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $=id=>document.getElementById(id), status=$('status'), scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc9e8);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,150);camera.position.set(0,1.65,8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.xr.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f6ff,0x35513a,2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(-8,14,6);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});const grass=mat(0x267d3b),line=mat(0xffffff),ballMat=mat(0xffffff),dark=mat(0x111719);
function box(w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);scene.add(o);return o}
box(44,.18,62,grass,0,-.13,-17);for(let i=0;i<11;i++)box(44,.01,5.6,i%2?mat(0x2d8741):grass,0,-.03,-43+i*5.6);
function line3(points){const g=new THREE.BufferGeometry().setFromPoints(points.map(p=>new THREE.Vector3(...p)));scene.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xffffff})))}
line3([[-21,-.02,12],[-21,-.02,-46],[21,-.02,-46],[21,-.02,12],[-21,-.02,12]]);line3([[-21,-.02,-17],[21,-.02,-17]]);
const circle=new THREE.Mesh(new THREE.TorusGeometry(4.2,.03,8,80),line);circle.rotation.x=Math.PI/2;circle.position.set(0,-.015,-17);scene.add(circle);
const ball=new THREE.Mesh(new THREE.SphereGeometry(.23,24,18),ballMat);ball.position.set(0,.23,1.7);scene.add(ball);for(let i=0;i<8;i++){const p=new THREE.Mesh(new THREE.CircleGeometry(.06,5),dark);p.position.set(Math.cos(i*Math.PI/4)*.2,.23+Math.sin(i*Math.PI/4)*.13,1.7+Math.sin(i*Math.PI/4)*.2);scene.add(p)}
const goalZ=-40.5;box(.13,2.44,.13,line,-3.66,1.22,goalZ);box(.13,2.44,.13,line,3.66,1.22,goalZ);box(7.4,.13,.13,line,0,2.44,goalZ);
let socket=null,joined=false,myId=null,remotes=new Map();
function avatar(p){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.CapsuleGeometry(.25,.5,4,8),mat(p.color||0x58a6ff));body.position.y=1.1;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.16,12,10),mat(0xc99572));head.position.y=1.6;g.add(head);scene.add(g);g.position.set(p.x||0,p.y||0,p.z||0);remotes.set(p.id,g)}
$('join').onclick=()=>{if(typeof io==='undefined'){status.textContent='Socket connection unavailable.';return}if(socket)socket.disconnect();socket=io();socket.on('connect',()=>socket.emit('joinRoom',{name:$('name').value||'Player',room:$('room').value||'KICKOFF'}));socket.on('joined',d=>{myId=d.id;joined=true;$('vr').hidden=false;status.textContent='Connected! Share room code '+$('room').value;d.players.filter(p=>p.id!==myId).forEach(avatar);ball.position.set(d.ball.x,d.ball.y,d.ball.z);$('score').textContent=d.score.home+' — '+d.score.away});socket.on('playerJoined',avatar);socket.on('playerLeft',id=>{if(remotes.has(id)){scene.remove(remotes.get(id));remotes.delete(id)}});socket.on('playerState',p=>{const g=remotes.get(p.id);if(g)g.position.set(p.x,p.y,p.z)});socket.on('ballState',b=>{ball.position.set(b.x,b.y,b.z);$('score').textContent=b.score.home+' — '+b.score.away});socket.on('roomFull',()=>status.textContent='Room full — try another code');socket.on('connect_error',()=>status.textContent='Could not connect to server.')};
const raycaster=new THREE.Raycaster();renderer.domElement.addEventListener('pointerdown',e=>{if(!joined)return;const pt=new THREE.Vector2(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);raycaster.setFromCamera(pt,camera);if(raycaster.intersectObject(ball).length){const dir=new THREE.Vector3(pt.x*.4,.35,-1).normalize();socket.emit('kick',{direction:{x:dir.x,y:dir.y,z:dir.z}})}});
const controllers=[];for(let i=0;i<2;i++){const c=renderer.xr.getController(i);const ray=new THREE.Line(new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(),new THREE.Vector3(0,0,-1)]),new THREE.LineBasicMaterial({color:0xa8ffbd}));ray.scale.z=7;c.add(ray);c.addEventListener('selectstart',()=>{if(!joined)return;const q=new THREE.Quaternion();c.getWorldQuaternion(q);const dir=new THREE.Vector3(0,0,-1).applyQuaternion(q);const o=new THREE.Vector3();c.getWorldPosition(o);if(o.distanceTo(ball.position)<12)socket.emit('kick',{direction:{x:dir.x,y:Math.max(.2,dir.y),z:Math.min(-.15,dir.z)}})});scene.add(c);controllers.push(c)}
$('vr').onclick=async()=>{try{if(!navigator.xr||!await navigator.xr.isSessionSupported('immersive-vr')){status.textContent='Open this HTTPS page in Meta Quest Browser for VR.';return}await renderer.xr.setSession(await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']}));$('vr').hidden=true}catch(e){status.textContent='Could not enter VR: '+e.message}};
let last=0;renderer.setAnimationLoop(ms=>{if(joined&&socket&&ms-last>66){last=ms;const p=new THREE.Vector3(),q=new THREE.Quaternion();if(renderer.xr.isPresenting){renderer.xr.getCamera(camera).getWorldPosition(p);renderer.xr.getCamera(camera).getWorldQuaternion(q)}else{p.copy(camera.position);q.copy(camera.quaternion)}socket.emit('pose',{x:p.x,y:p.y,z:p.z,yaw:new THREE.Euler().setFromQuaternion(q,'YXZ').y})}renderer.render(scene,camera)});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
